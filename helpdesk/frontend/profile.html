<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Premium IT Helpdesk</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e40af;
            --primary-light: #3b82f6;
            --primary-dark: #1e3a8a;
            --secondary: #0891b2;
            --bg-light: #f8fafc;
            --text-dark: #0f172a;
            --text-medium: #475569;
            --text-light: #94a3b8;
            --border: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            background-image: radial-gradient(at 0% 0%, hsla(217, 100%, 76%, 0.15) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, hsla(190, 100%, 76%, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-dark);
            min-height: 100vh;
        }

        /* Nav Header */
        .header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 1rem;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .logo-section:hover {
            transform: scale(1.02);
        }

        .logo-icon {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 12px;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
        }

        .logo-text h1 {
            font-size: 1.25rem;
            font-weight: 800;
            background: linear-gradient(to right, var(--primary-dark), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.025em;
        }

        .btn {
            padding: 0.625rem 1.25rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            border: none;
            outline: none;
        }

        .btn-outline {
            background: white;
            border: 1px solid var(--border);
            color: var(--text-dark);
        }

        .btn-outline:hover {
            background: var(--bg-light);
            border-color: #cbd5e1;
            transform: translateY(-1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(30, 64, 175, 0.3);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(30, 64, 175, 0.4);
            background: linear-gradient(135deg, var(--primary-dark) 0%, #06b6d4 100%);
        }

        /* Layout Main */
        .profile-container {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 2rem;
        }

        /* Profile Left Card */
        .profile-side-card {
            background: white;
            border-radius: 20px;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: var(--shadow-xl);
            position: relative;
            overflow: hidden;
            height: max-content;
        }

        .profile-side-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 120px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            z-index: 0;
        }

        .profile-avatar-wrapper {
            position: relative;
            z-index: 1;
            margin-bottom: 1.5rem;
            display: inline-block;
        }

        .profile-avatar-large {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: white;
            border: 4px solid white;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary);
            position: relative;
        }

        .profile-side-info {
            position: relative;
            z-index: 1;
        }

        .profile-side-info h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 0.25rem;
        }

        .profile-side-info p {
            color: var(--text-medium);
            font-size: 0.9375rem;
            margin-bottom: 1.5rem;
        }

        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            background: #eff6ff;
            color: var(--primary-dark);
            padding: 0.375rem 1rem;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 0.8125rem;
            border: 1px solid #bfdbfe;
        }

        .side-stats {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px dashed var(--border);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .side-stat-item h4 {
            font-size: 1.25rem;
            color: var(--primary);
            font-weight: 800;
        }

        .side-stat-item span {
            font-size: 0.75rem;
            color: var(--text-medium);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        /* Main Form Area */
        .profile-main {
            background: white;
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }

        .profile-main-header {
            padding: 2rem;
            border-bottom: 1px solid var(--border);
            background: #fafafa;
        }

        .profile-main-header h3 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .profile-form-body {
            padding: 2rem;
        }

        .section-title {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-light);
            font-weight: 700;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem 2rem;
            margin-bottom: 2.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            color: var(--text-light);
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9375rem;
            color: var(--text-dark);
            background: white;
            transition: all 0.2s;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
        }

        .form-input:disabled {
            background: var(--bg-light);
            color: var(--text-medium);
            cursor: not-allowed;
            border-color: #e2e8f0;
        }

        .form-textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9375rem;
            color: var(--text-dark);
            font-family: 'Inter', sans-serif;
            resize: vertical;
            outline: none;
            transition: all 0.2s;
        }

        .form-textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
        }

        .actions-footer {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }

        @media (max-width: 860px) {
            .profile-container {
                grid-template-columns: 1fr;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo-section" onclick="window.location.href='index.html'">
                <div class="logo-icon">
                    <i data-lucide="zap" style="color: white; width: 24px; height: 24px;"></i>
                </div>
                <div class="logo-text">
                    <h1>POWERGRID IT</h1>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn btn-outline" onclick="window.location.href='index.html'">
                    <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i> Dashboard
                </button>
            </div>
        </div>
    </header>

    <main class="profile-container">
        <!-- Left Sidebar: Visual ID Card -->
        <aside class="profile-side-card">
            <div class="profile-avatar-wrapper">
                <div class="profile-avatar-large" id="profileInitials"></div>
                <!-- Dynamic active status pip -->
                <div style="position: absolute; bottom: 8px; right: 8px; width: 20px; height: 20px; background: var(--success); border: 4px solid white; border-radius: 50%;"></div>
            </div>
            
            <div class="profile-side-info">
                <h2 id="profileNameDisplay">Loading...</h2>
                <p id="profileEmailDisplay">Loading details...</p>
                <div class="role-badge" id="profileRoleBadge">
                    <i data-lucide="shield-check" style="width: 14px; height: 14px;"></i> 
                    <span>Role</span>
                </div>
            </div>

            <div class="side-stats">
                <div class="side-stat-item">
                    <h4>Active</h4>
                    <span>Status</span>
                </div>
                <div class="side-stat-item" style="border-left: 1px dashed var(--border);">
                    <h4 id="profileEmpIdBadge">---</h4>
                    <span>Employee ID</span>
                </div>
            </div>
            
            <button class="btn btn-outline" style="width: 100%; margin-top: 2rem; color: var(--danger); border-color: #fecaca; background: #fef2f2;" onclick="logout()">
                <i data-lucide="log-out" style="width: 16px; height: 16px;"></i> Secure Logout
            </button>
        </aside>

        <!-- Right Main Form -->
        <section class="profile-main">
            <div class="profile-main-header">
                <h3><i data-lucide="user-cog" style="color: var(--primary);"></i> Account Settings & Identity</h3>
            </div>
            
            <div class="profile-form-body">
                <form id="profileForm">
                    
                    <div class="section-title">Verified Credentials</div>
                    <div class="form-grid" style="grid-template-columns: 1fr 1fr;">
                        <div class="form-group">
                            <label class="form-label">Full Name</label>
                            <div class="input-wrapper">
                                <i data-lucide="user" class="input-icon"></i>
                                <input type="text" id="profName" class="form-input" disabled>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Email Address</label>
                            <div class="input-wrapper">
                                <i data-lucide="mail" class="input-icon"></i>
                                <input type="email" id="profEmail" class="form-input" disabled>
                            </div>
                        </div>
                    </div>

                    <div class="section-title">Contact & Company Info</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">Mobile Number *</label>
                            <div class="input-wrapper">
                                <i data-lucide="phone" class="input-icon"></i>
                                <input type="tel" id="profMobile" class="form-input" placeholder="+91 9999999999" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Department / Batch</label>
                            <div class="input-wrapper">
                                <i data-lucide="briefcase" class="input-icon"></i>
                                <input type="text" id="profBatch" class="form-input" placeholder="e.g. IT Operations 2023" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Date of Birth</label>
                            <div class="input-wrapper">
                                <i data-lucide="calendar" class="input-icon"></i>
                                <input type="date" id="profDob" class="form-input" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Nationality</label>
                            <div class="input-wrapper">
                                <i data-lucide="flag" class="input-icon"></i>
                                <input type="text" id="profNationality" class="form-input" placeholder="e.g. Indian">
                            </div>
                        </div>

                        <div class="form-group full-width">
                            <label class="form-label">Home Address *</label>
                            <textarea id="profAddress" class="form-textarea" rows="3" placeholder="Provide your full residential address for security records" required></textarea>
                        </div>
                    </div>

                    <div class="section-title">Government Identity</div>
                    <div class="form-grid" style="margin-bottom: 0;">
                        <div class="form-group full-width">
                            <label class="form-label">ID Proof Number (Aadhar / PAN / Passport) *</label>
                            <div class="input-wrapper">
                                <i data-lucide="fingerprint" class="input-icon"></i>
                                <input type="text" id="profIdProof" class="form-input" placeholder="Enter secure identification number" required>
                            </div>
                        </div>
                    </div>

                    <div class="actions-footer">
                        <button type="submit" class="btn btn-primary" id="saveProfileBtn">
                            <i data-lucide="save" style="width: 16px; height: 16px;"></i> Update Profile Specs
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <!-- Global Alert Container -->
    <div id="alertContainer" style="position: fixed; top: 1.5rem; right: 1.5rem; z-index: 1000; display: flex; flex-direction: column; gap: 0.75rem;"></div>

    <script>
        lucide.createIcons();

        // System Constants
        const API_URL = "http://localhost:5000/api/auth";
        const TOKEN = localStorage.getItem("token");
        const USER = JSON.parse(localStorage.getItem("user"));

        // Auth Guardian
        if (!TOKEN || !USER) {
            window.location.href = "login.html";
        }

        // Global Fancy Alert
        function showGlobalAlert(message, type = 'success') {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            
            const isSuccess = type === 'success';
            const bgColor = isSuccess ? '#ecfdf5' : '#fef2f2';
            const border = isSuccess ? '#10b981' : '#ef4444';
            const color = isSuccess ? '#047857' : '#b91c1c';
            const icon = isSuccess ? 'check-circle-2' : 'alert-circle';
            
            alert.style.cssText = `
                background: ${bgColor};
                border-left: 4px solid ${border};
                color: ${color};
                padding: 1rem 1.25rem;
                border-radius: 8px;
                box-shadow: var(--shadow-lg);
                min-width: 320px;
                animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
                display: flex;
                align-items: center;
                gap: 0.75rem;
            `;
            
            alert.innerHTML = `
                <i data-lucide="${icon}" style="width:20px; height:20px;"></i>
                <div style="flex: 1; font-weight: 600; font-size: 0.9375rem;">${message}</div>
            `;
            
            container.appendChild(alert);
            lucide.createIcons();
            
            const keyframes = document.createElement('style');
            keyframes.innerHTML = `
                @keyframes slideIn { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }
                @keyframes slideOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(50px); } }
            `;
            document.head.appendChild(keyframes);

            setTimeout(() => {
                alert.style.animation = 'slideOut 0.3s ease-in forwards';
                setTimeout(() => alert.remove(), 300);
            }, 3000);
        }

        // Bootstrap the Profile View
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('profileNameDisplay').textContent = USER.name;
            document.getElementById('profileEmailDisplay').textContent = USER.email;
            document.querySelector('#profileRoleBadge span').textContent = USER.role;
            document.getElementById('profileEmpIdBadge').textContent = USER.employee_id || "N/A";

            // Initials logic
            const nameParts = USER.name.trim().split(" ");
            let initials = nameParts[0][0];
            if (nameParts.length > 1) {
                initials += nameParts[1][0];
            }
            document.getElementById('profileInitials').textContent = initials.toUpperCase();

            // Populate Form Fields
            document.getElementById('profName').value = USER.name || "";
            document.getElementById('profEmail').value = USER.email || "";
            document.getElementById('profMobile').value = USER.mobile_number || "";
            document.getElementById('profBatch').value = USER.batch || "";
            document.getElementById('profDob').value = USER.date_of_birth || "";
            document.getElementById('profNationality').value = USER.nationality || "";
            document.getElementById('profIdProof').value = USER.id_proof_number || "";
            document.getElementById('profAddress').value = USER.home_address || "";
        });

        // Save Profile Logic
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('saveProfileBtn');
            btn.innerHTML = `<span style="width:16px; height:16px; border:2px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin 1s linear infinite; display:inline-block;"></span> Saving...`;
            btn.disabled = true;

            const styleNode = document.createElement('style');
            styleNode.innerHTML = `@keyframes spin { to { transform: rotate(360deg); } }`;
            document.head.appendChild(styleNode);

            const payload = {
                mobile_number: document.getElementById('profMobile').value,
                batch: document.getElementById('profBatch').value,
                date_of_birth: document.getElementById('profDob').value,
                home_address: document.getElementById('profAddress').value,
                nationality: document.getElementById('profNationality').value,
                id_proof_number: document.getElementById('profIdProof').value
            };

            let isSuccess = false;
            try {
                const userId = USER.id || USER._id;
                const response = await fetch(`${API_URL}/profile/${userId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    isSuccess = true;
                    // Cache the fresh user state
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showGlobalAlert("Profile credentials updated successfully", "success");
                    
                    setTimeout(() => {
                        window.location.href = 'index.html'; // auto redirect back to dashboard
                    }, 1500);
                } else {
                    showGlobalAlert(data.message || "Credential update failed", "error");
                }
            } catch (error) {
                console.error("Profile sync exception:", error);
                showGlobalAlert("Network disconnect. Please retry.", "error");
            } finally {
                if(!isSuccess){
                    setTimeout(() => {
                        btn.disabled = false;
                        btn.innerHTML = `<i data-lucide="save" style="width: 16px; height: 16px;"></i> Update Profile Specs`;
                        lucide.createIcons();
                    }, 1000);
                }
            }
        });

        function logout() {
            localStorage.clear();
            window.location.href = "login.html";
        }
    </script>
    <!-- Global Team Photo Modal -->
    <script>
    function initTeamModal() {
        if(document.getElementById('teamPhotoModal')) return;
        const modalHtml = `
          <div id="teamPhotoModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:99999; justify-content:center; align-items:center; opacity:0; transition: opacity 0.3s ease;">
              <div style="position:relative; max-width:90%; max-height:90%; text-align:center;">
                  <button onclick="document.getElementById('teamPhotoModal').style.opacity='0'; setTimeout(()=>document.getElementById('teamPhotoModal').style.display='none', 300)" style="position:absolute; top:-40px; right:0; background:none; border:none; color:white; font-size:2.5rem; cursor:pointer; line-height:1;">&times;</button>
                  <img src="assets/teamphoto.png" alt="Team Info" style="max-width:100%; max-height:90vh; border-radius:12px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);">
              </div>
          </div>
        `;
        document.body.insertAdjacentHTML('beforeend', modalHtml);

        const logos = document.querySelectorAll('.logo-section, .logo-container, .logo-icon, [data-lucide="zap"]');
        logos.forEach(logo => {
            logo.style.cursor = 'pointer';
            logo.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                const modal = document.getElementById('teamPhotoModal');
                if(modal) {
                    modal.style.display = 'flex';
                    setTimeout(() => modal.style.opacity = '1', 10);
                }
            }, true);
        });
    }
    document.addEventListener('DOMContentLoaded', initTeamModal);
    </script>
</body>
</html>
